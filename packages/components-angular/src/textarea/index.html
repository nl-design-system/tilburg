<!-- With a FormControl the control owns the value and the disabled state (binding `[disabled]` next to
     `[formControl]` triggers Angular's reactive-forms warning); without one, `disabled` is an input.
     `name` and `dir` are written in `ngAfterViewChecked`: the utrecht directive's host bindings would strip them. -->
@if (control) {
<textarea
  #textarea
  [attr.id]="id || null"
  [formControl]="control"
  [class.utrecht-textarea--disabled]="control.disabled"
  [invalid]="invalid"
  [required]="required"
  [readonly]="readonly"
  [attr.placeholder]="placeholder || null"
  [attr.rows]="rows ?? null"
  [rows]="rows"
  [attr.cols]="cols ?? null"
  [attr.aria-label]="ariaLabel || null"
  [attr.aria-labelledby]="ariaLabelledBy || null"
  [attr.aria-describedby]="ariaDescribedBy || null"
  [attr.aria-invalid]="invalid ? 'true' : null"
  [attr.aria-required]="required ? 'true' : null"
  [attr.autocomplete]="autocomplete || null"
  (blur)="blur.emit($event)"
  (focus)="focus.emit($event)"
  tilburgTextAreaAutoResize
  utrecht-textarea
></textarea>
} @else {
<textarea
  #textarea
  [attr.id]="id || null"
  [disabled]="disabled"
  [invalid]="invalid"
  [required]="required"
  [readonly]="readonly"
  [attr.placeholder]="placeholder || null"
  [attr.rows]="rows ?? null"
  [rows]="rows"
  [attr.cols]="cols ?? null"
  [attr.aria-label]="ariaLabel || null"
  [attr.aria-labelledby]="ariaLabelledBy || null"
  [attr.aria-describedby]="ariaDescribedBy || null"
  [attr.aria-invalid]="invalid ? 'true' : null"
  [attr.aria-required]="required ? 'true' : null"
  [attr.autocomplete]="autocomplete || null"
  (blur)="blur.emit($event)"
  (focus)="focus.emit($event)"
  tilburgTextAreaAutoResize
  utrecht-textarea
></textarea>
}

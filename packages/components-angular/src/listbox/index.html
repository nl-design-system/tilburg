<div
  class="utrecht-listbox utrecht-listbox--html-div"
  [class.utrecht-listbox--disabled]="isDisabled"
  [class.utrecht-listbox--invalid]="showInvalid"
  role="listbox"
  tabindex="0"
  [id]="internalId"
  [attr.aria-label]="ariaLabel || null"
  [attr.aria-labelledby]="ariaLabelledBy || null"
  [attr.aria-describedby]="ariaDescribedBy || null"
  [attr.aria-activedescendant]="activeIndex() >= 0 ? optionId(activeIndex()) : null"
  [attr.aria-disabled]="isDisabled ? 'true' : null"
  [attr.aria-invalid]="showInvalid ? 'true' : null"
  [attr.aria-multiselectable]="multiple ? 'true' : null"
  [attr.aria-required]="required ? 'true' : null"
  (keydown)="onKeydown($event)"
  (focus)="onFocus()"
  (blur)="onBlur()"
>
  <ul class="utrecht-listbox__list" role="presentation">
    @for (item of items; track $index) {
    <li
      class="utrecht-listbox__option utrecht-listbox__option--html-li"
      [class.utrecht-listbox__option--selected]="isSelected(item)"
      role="option"
      [id]="optionId($index)"
      [attr.aria-selected]="isSelected(item) ? 'true' : 'false'"
      [attr.data-active]="activeIndex() === $index ? 'true' : null"
      (click)="onOptionClick($index)"
    >
      {{ getLabel(item) }}
    </li>
    }
  </ul>
</div>

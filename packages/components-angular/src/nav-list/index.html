<ul *ngIf="items?.length" class="utrecht-nav-list" [class.utrecht-nav-list--center]="center" role="list">
  <li *ngFor="let item of items" class="utrecht-nav-list__item">
    <a
      class="utrecht-link utrecht-link--html-a utrecht-nav-list__link"
      [class.utrecht-link--current]="item.current"
      [attr.href]="item.href || '#'"
      [attr.aria-current]="item.current ? 'page' : null"
      (click)="itemClick.emit({ item, event: $event })"
      >{{ item.label }}</a
    >
  </li>
</ul>

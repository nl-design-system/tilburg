<!-- One <ng-content> only: Angular projects content once, so the branches share this template. -->
<ng-template #content><ng-content></ng-content></ng-template>
@if (dateTime !== undefined) {
<time class="utrecht-preserve-data" [attr.datetime]="dateTime"
  ><bdi translate="no"><ng-container *ngTemplateOutlet="content"></ng-container></bdi
></time>
} @else if (value !== undefined) {
<data class="utrecht-preserve-data" [attr.value]="value"
  ><bdi translate="no"><ng-container *ngTemplateOutlet="content"></ng-container></bdi
></data>
} @else {
<bdi class="utrecht-preserve-data" translate="no"><ng-container *ngTemplateOutlet="content"></ng-container></bdi>
}

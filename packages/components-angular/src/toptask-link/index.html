<a
  class="utrecht-toptask-link"
  [attr.href]="href || null"
  [attr.aria-label]="ariaLabel || null"
  [attr.aria-describedby]="ariaDescribedBy || null"
>
  <!-- The component removes the icon wrapper while no icon element is projected. -->
  <span #icon class="utrecht-toptask-link__icon"><ng-content select="[slot=icon]"></ng-content></span>
  <span #title class="utrecht-toptask-link__title"><ng-content></ng-content></span>
</a>

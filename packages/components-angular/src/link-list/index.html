@if (links?.length) {
<ul
  class="utrecht-link-list utrecht-link-list--html-ul"
  role="list"
  [attr.aria-label]="ariaLabel || null"
  [attr.aria-labelledby]="ariaLabelledBy || null"
>
  @for (link of links; track $index) {
  <li class="utrecht-link-list__item">
    <a
      class="utrecht-link utrecht-link--html-a utrecht-link-list__link"
      [attr.href]="link.href"
      [attr.rel]="link.external ? 'external noopener noreferrer' : null"
      [attr.aria-current]="link.current ?? null"
      ><svg
        class="utrecht-icon"
        aria-hidden="true"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <polyline points="9 18 15 12 9 6" /></svg
      ><span class="utrecht-link-list__link-text">{{ link.label }}</span></a
    >
  </li>
  }
</ul>
}

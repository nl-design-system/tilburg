packages:
  - components/**
  - packages/*
  - proprietary/*

allowBuilds:
  "@bundled-es-modules/glob": true
  "@parcel/watcher": true
  esbuild: true
  lmdb: true
  msgpackr-extract: true
  style-dictionary: true

# Configure pnpm so peer dependencies must be explicitly added instead of being automatically installed.
autoInstallPeers: false

engineStrict: true

minimumReleaseAge: 1440

minimumReleaseAgeExclude:
  - '@amsterdam/*'
  - '@gemeente-denhaag/*'
  - '@gemeente-rotterdam/*'
  - '@nl-design-system/*'
  - '@nl-design-system-candidate/*'
  - '@nl-design-system-community/*'
  - '@nl-design-system-unstable/*'
  - '@nl-rvo/*'
  - '@rijkshuisstijl-community/*'
  - '@utrecht/*'

overrides:
  form-data@>=4.0.0 <4.0.6: ^4.0.6
  # Critical advisory in shell-quote <1.11.0 (GHSA-pqg4-j6r4-53mv), via changesets, npm-run-all and webpack-dev-server.
  shell-quote@<1.11.0: ^1.11.0
  # High advisory in @modelcontextprotocol/sdk <1.31.0 (OAuth credentials), pinned at 1.30.0 by @angular/cli 20.3.37.
  "@modelcontextprotocol/sdk@>=1.12.0 <1.31.0": ^1.31.0
  tar@<=7.5.18: ^7.5.19
  # Critical advisory in piscina <5.3.2 (via @angular/build 20.3.37, which pins 5.2.0). Angular 20.3.38 moves to
  # 5.3.2 itself: drop this override once the Angular build tooling is on 20.3.38 or later.
  piscina@<5.3.2: ^5.3.2
  # High-severity advisories with a fix in the same major version, reached only through build and test tooling.
  http-cache-semantics@<4.2.1: ^4.2.1
  js-yaml@>=3.0.0 <3.15.2: ^3.15.2
  source-map-js@<1.2.2: ^1.2.2
  webpack-dev-middleware@>=7.0.0 <7.4.5: ^7.4.5

saveExact: true

savePrefix: ''

strictPeerDependencies: false

<svg
  viewBox="0 0 760 412"
  xmlns="http://www.w3.org/2000/svg"
  role="img"
  aria-labelledby="layers-title layers-desc"
  style="font-family: 'Roboto', 'Helvetica Neue', Arial, sans-serif"
>
  <title id="layers-title">Lagen van het Tilburg Design System</title>
  <desc id="layers-desc">
    Je website of applicatie kiest één laag: React, Angular, Web Components, of zelf de HTML schrijven. Alle vier maken
    precies dezelfde Tilburg HTML/CSS. Die bouwt op twee fundamenten: de Utrecht-basis van NL Design System en de
    design tokens, met de thema's Tilburg en BAT en een hoogcontrastmodus.
  </desc>
  <defs>
    <marker id="layers-arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#5B6E8A" />
    </marker>
  </defs>

  <!-- 1. Who uses it -->
  <rect x="40" y="16" width="680" height="50" rx="8" fill="#fff" stroke="#5B6E8A" stroke-width="1.5" stroke-dasharray="6 4" />
  <text x="380" y="38" text-anchor="middle" font-size="14" font-weight="700" fill="#333">Jouw website of applicatie</text>
  <text x="380" y="56" text-anchor="middle" font-size="11" fill="#5B6E8A">kiest één laag, per pagina dezelfde</text>

  <g stroke="#5B6E8A" stroke-width="1.5" marker-end="url(#layers-arrow)">
    <line x1="120.5" y1="66" x2="120.5" y2="96" />
    <line x1="293.5" y1="66" x2="293.5" y2="96" />
    <line x1="466.5" y1="66" x2="466.5" y2="96" />
    <line x1="639.5" y1="66" x2="639.5" y2="96" />
  </g>

  <!-- 2. The four layers -->
  <g font-size="10" text-anchor="middle">
    <rect x="40" y="100" width="161" height="78" rx="6" fill="#E6F6FF" stroke="#5B6E8A" stroke-width="1.5" />
    <text x="120.5" y="124" font-size="13" font-weight="700" fill="#333">React</text>
    <text x="120.5" y="144" fill="#5B6E8A" font-family="monospace">components-react</text>
    <text x="120.5" y="163" fill="#5B6E8A">&lt;Alert /&gt;</text>

    <rect x="213" y="100" width="161" height="78" rx="6" fill="#E6F6FF" stroke="#5B6E8A" stroke-width="1.5" />
    <text x="293.5" y="124" font-size="13" font-weight="700" fill="#333">Angular</text>
    <text x="293.5" y="144" fill="#5B6E8A" font-family="monospace">components-angular</text>
    <text x="293.5" y="163" fill="#5B6E8A">&lt;tilburg-alert&gt;</text>

    <rect x="386" y="100" width="161" height="78" rx="6" fill="#E6F6FF" stroke="#5B6E8A" stroke-width="1.5" />
    <text x="466.5" y="124" font-size="13" font-weight="700" fill="#333">Web Components</text>
    <text x="466.5" y="144" fill="#5B6E8A" font-family="monospace">web-components-stencil</text>
    <text x="466.5" y="163" fill="#5B6E8A">&lt;tilburg-wbc-alert&gt;, elke stack</text>

    <rect x="559" y="100" width="161" height="78" rx="6" fill="#fff" stroke="#C8006C" stroke-width="1.5" />
    <text x="639.5" y="124" font-size="13" font-weight="700" fill="#333">Zelf HTML schrijven</text>
    <text x="639.5" y="144" fill="#5B6E8A" font-family="monospace">components-css</text>
    <text x="639.5" y="163" fill="#5B6E8A">class="utrecht-alert"</text>
  </g>

  <g stroke="#5B6E8A" stroke-width="1.5" marker-end="url(#layers-arrow)">
    <line x1="120.5" y1="178" x2="120.5" y2="210" />
    <line x1="293.5" y1="178" x2="293.5" y2="210" />
    <line x1="466.5" y1="178" x2="466.5" y2="210" />
    <line x1="639.5" y1="178" x2="639.5" y2="210" />
  </g>

  <!-- 3. The shared, leading HTML/CSS -->
  <rect x="40" y="214" width="680" height="68" rx="6" fill="#C8006C" stroke="#C8006C" stroke-width="1.5" />
  <text x="380" y="238" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">Tilburg HTML/CSS: leidend</text>
  <text x="380" y="257" text-anchor="middle" font-size="11" fill="#fff" font-family="monospace">@gemeente-tilburg/components-css</text>
  <text x="380" y="274" text-anchor="middle" font-size="11" fill="#fff" font-style="italic">
    elke laag rendert precies deze markup en classes
  </text>

  <g stroke="#5B6E8A" stroke-width="1.5" marker-end="url(#layers-arrow)">
    <line x1="207" y1="282" x2="207" y2="314" />
    <line x1="553" y1="282" x2="553" y2="314" />
  </g>

  <!-- 4. The two foundations -->
  <g text-anchor="middle">
    <rect x="40" y="318" width="334" height="78" rx="6" fill="#fff" stroke="#5B6E8A" stroke-width="1.5" />
    <text x="207" y="342" font-size="13" font-weight="700" fill="#333">Utrecht-basis (NL Design System)</text>
    <text x="207" y="362" font-size="10" fill="#5B6E8A" font-family="monospace">@utrecht/component-library-css</text>
    <text x="207" y="381" font-size="10" fill="#5B6E8A">HTML en basisstijl van de utrecht-*-componenten</text>

    <rect x="386" y="318" width="334" height="78" rx="6" fill="#fff" stroke="#5B6E8A" stroke-width="1.5" />
    <text x="553" y="342" font-size="13" font-weight="700" fill="#333">Design tokens</text>
    <text x="553" y="362" font-size="10" fill="#5B6E8A" font-family="monospace">@gemeente-tilburg/design-tokens</text>
    <text x="553" y="381" font-size="10" fill="#5B6E8A">tilburg-theme · bat-theme · hoog contrast</text>
  </g>
</svg>

    <text x="120.5" y="124" font-size="13" font-weight="700" fill="#333">Ik kijk rond</text>
    <text x="120.5" y="144" fill="#5B6E8A">wat is het en</text>
    <text x="120.5" y="159" fill="#5B6E8A">hoe ziet het eruit?</text>

    <rect x="213" y="100" width="161" height="78" rx="6" fill="#E6F6FF" stroke="#5B6E8A" stroke-width="1.5" />

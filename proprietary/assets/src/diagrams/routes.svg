    <text x="293.5" y="159" fill="#5B6E8A">applicatie maken</text>

    <rect x="386" y="100" width="161" height="78" rx="6" fill="#E6F6FF" stroke="#5B6E8A" stroke-width="1.5" />
    <text x="466.5" y="124" font-size="13" font-weight="700" fill="#333">Ik werk eraan mee</text>
    <text x="466.5" y="144" fill="#5B6E8A">een bug, een nieuw</text>
    <text x="466.5" y="159" fill="#5B6E8A">component, de documentatie</text>


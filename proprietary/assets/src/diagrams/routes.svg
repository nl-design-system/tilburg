<svg
  viewBox="0 0 760 412"
  xmlns="http://www.w3.org/2000/svg"
  role="img"
  aria-labelledby="routes-title routes-desc"
  style="font-family: 'Roboto', 'Helvetica Neue', Arial, sans-serif"
>
  <title id="routes-title">Waar begin ik in deze documentatie?</title>
  <desc id="routes-desc">
    Vier ingangen. Kijk je rond, begin dan bij Voorbeelden en ga daarna naar Implementatiestatus, de tokenpagina
    Colors en Toestemming voor gebruik. Bouw je ermee, begin dan bij Aan de slag en gebruik daarna de knop Gebruik,
    Tips en valkuilen en Implementatiestatus. Werk je eraan mee, begin dan bij Je eerste wijziging; daarna pnpm new,
    pnpm verify, pnpm ship en CONTRIBUTING.md. Ontwerp je, begin dan bij de sectie Voor ontwerpers op Tokens; daarna
    de pagina's Colors, Space en Typography, Thema's en Hoog contrast, en de componenten onder Tilburg HTML.
  </desc>
  <!-- The page shows this file in an <object>, so the links work: relative to this file, `../` is the Storybook.
       scripts/usage-snippets.test.mjs checks that every page linked here exists in both Storybooks. -->
  <style>
    a text { text-decoration: underline; }
    a:hover rect { fill: #a00057; }
    a:hover text, a:focus text { text-decoration-thickness: 2px; }
    a:focus { outline: 2px solid #333; outline-offset: 2px; }
  </style>
  <defs>
    <marker id="routes-arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#5B6E8A" />
    </marker>
  </defs>

  <!-- 1. The question -->
  <rect x="40" y="16" width="680" height="50" rx="8" fill="#fff" stroke="#5B6E8A" stroke-width="1.5" stroke-dasharray="6 4" />
  <text x="380" y="38" text-anchor="middle" font-size="14" font-weight="700" fill="#333">Wat kom je hier doen?</text>
  <text x="380" y="56" text-anchor="middle" font-size="11" fill="#5B6E8A">kies de kolom die bij je past</text>

